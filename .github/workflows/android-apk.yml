name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: "17"
        distribution: "temurin"

    # android-actions/setup-android@v3 accepts exactly four inputs —
    # cmdline-tools-version, accept-android-sdk-licenses,
    # log-accepted-android-sdk-licenses and packages
    # (https://github.com/android-actions/setup-android/blob/v3/action.yml).
    #
    # This step used to pass `api-level`, `build-tools` and `ndk`. None of those
    # inputs exist, so they were ignored and the action fell back to its default
    # `packages: "tools platform-tools"`; `sdkmanager tools` fails on the
    # runner's cmdline-tools 16, where the `tools` package was removed, and the
    # action treats that as fatal:
    #   Warning: Failed to find package 'tools'
    #   Error: The process '.../sdkmanager' failed with exit code 1
    # That killed the workflow after ~21 s on every run (40070746189,
    # 40071309858), before Gradle, the unit tests or the APK build ever ran.
    #
    # Passing the packages this project needs through `packages` is the fix:
    # platform 34 + build-tools 34.0.0 for AGP 8.2.2, and NDK 25.1.8937393 +
    # CMake 3.22.1 for the native DSP module. `accept-android-sdk-licenses`
    # (default true) answers the licence prompts non-interactively, and the
    # action installs the packages one by one, so a genuine SDK failure still
    # fails the step instead of being swallowed.
    - name: Set up Android SDK and NDK
      uses: android-actions/setup-android@v3
      with:
        packages: "platform-tools platforms;android-34 build-tools;34.0.0 ndk;25.1.8937393 cmake;3.22.1"
        accept-android-sdk-licenses: true

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: "8.5"

    - name: Configure local.properties
      working-directory: conversations/6a7a961312b12b330076a6ce/android-eq
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "cmake.dir=$ANDROID_HOME/cmake/3.22.1" >> local.properties

    - name: Override CMake path for CI (use SDK-managed CMake on x86_64 runner)
      working-directory: conversations/6a7a961312b12b330076a6ce/android-eq
      run: |
        sed -i '/^android.cmake.path/d' gradle.properties

    - name: Run unit tests
      working-directory: conversations/6a7a961312b12b330076a6ce/android-eq
      run: |
        chmod +x gradlew
        ./gradlew testDebugUnitTest --no-daemon --continue

    - name: Build Debug APK
      working-directory: conversations/6a7a961312b12b330076a6ce/android-eq
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon -x test

    - name: Validate APK exists and is non-empty
      working-directory: conversations/6a7a961312b12b330076a6ce/android-eq
      run: |
        APK=app/build/outputs/apk/debug/app-debug.apk
        if [ ! -s "$APK" ]; then
          echo "ERROR: APK missing or empty: $APK"
          exit 1
        fi
        echo "APK size: $(stat -c %s "$APK") bytes"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: conversations/6a7a961312b12b330076a6ce/android-eq/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Upload test reports on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: conversations/6a7a961312b12b330076a6ce/android-eq/app/build/reports/
        retention-days: 30

    - name: Upload build logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: conversations/6a7a961312b12b330076a6ce/android-eq/app/build/
        retention-days: 30
