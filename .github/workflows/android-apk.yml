name: Build Debug APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: "17"
        distribution: "temurin"

    # android-actions/setup-android@v3 accepts exactly four inputs —
    # cmdline-tools-version, accept-android-sdk-licenses,
    # log-accepted-android-sdk-licenses and packages
    # (https://github.com/android-actions/setup-android/blob/v3/action.yml).
    #
    # Two things used to break this workflow, both in this step:
    #  * it passed `api-level`, `build-tools` and `ndk`, which are NOT v3
    #    inputs. Unknown inputs are ignored, so the step silently fell back to
    #    the action's default `packages: "tools platform-tools"`;
    #  * the `tools` package no longer exists in the runner's cmdline-tools 16,
    #    so `sdkmanager tools` exits 1 and the action treats that as fatal:
    #      Warning: Failed to find package 'tools'
    #      Error: The process '.../sdkmanager' failed with exit code 1
    #    That killed the job after ~21 s on every run (40070746189, 40071309858,
    #    40072560294), before Gradle, the tests or the APK build ever ran.
    #
    # So this step requests no obsolete package, and asks the action to accept
    # the SDK licences non-interactively (`accept-android-sdk-licenses` feeds
    # "y" to `sdkmanager --licenses`). The packages this project actually needs
    # are installed in the next step, by sdkmanager itself, so the command, its
    # full output and its exit code are all visible in the log.
    - name: Set up Android SDK tools
      uses: android-actions/setup-android@v3
      with:
        packages: "platform-tools"
        accept-android-sdk-licenses: true

    - name: Install Android SDK packages (platform 34, build-tools 34.0.0, NDK 25.1.8937393, CMake 3.22.1)
      run: |
        set -euo pipefail
        SDKMANAGER="$(command -v sdkmanager || true)"
        if [ -z "$SDKMANAGER" ]; then
          SDKMANAGER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools" -type f -name sdkmanager -print -quit)"
        fi
        test -n "$SDKMANAGER"
        echo "Using sdkmanager: $SDKMANAGER"
        "$SDKMANAGER" --version
        # Nothing is piped in and no error is suppressed: sdkmanager's own exit
        # code fails this step, and the licences were accepted above.
        "$SDKMANAGER" --install \
          "platforms;android-34" \
          "build-tools;34.0.0" \
          "ndk;25.1.8937393" \
          "cmake;3.22.1"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: "8.5"

    - name: Configure local.properties
      working-directory: conversations/6a7a961312b12b330076a6ce/android-eq
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "cmake.dir=$ANDROID_HOME/cmake/3.22.1" >> local.properties

    - name: Override CMake path for CI (use SDK-managed CMake on x86_64 runner)
      working-directory: conversations/6a7a961312b12b330076a6ce/android-eq
      run: |
        sed -i '/^android.cmake.path/d' gradle.properties

    - name: Run unit tests
      working-directory: conversations/6a7a961312b12b330076a6ce/android-eq
      run: |
        chmod +x gradlew
        ./gradlew testDebugUnitTest --no-daemon --continue

    - name: Build Debug APK
      working-directory: conversations/6a7a961312b12b330076a6ce/android-eq
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon -x test

    - name: Validate APK exists and is non-empty
      working-directory: conversations/6a7a961312b12b330076a6ce/android-eq
      run: |
        APK=app/build/outputs/apk/debug/app-debug.apk
        if [ ! -s "$APK" ]; then
          echo "ERROR: APK missing or empty: $APK"
          exit 1
        fi
        echo "APK size: $(stat -c %s "$APK") bytes"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: conversations/6a7a961312b12b330076a6ce/android-eq/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
        retention-days: 30

    - name: Upload test reports on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: conversations/6a7a961312b12b330076a6ce/android-eq/app/build/reports/
        retention-days: 30

    - name: Upload build logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: conversations/6a7a961312b12b330076a6ce/android-eq/app/build/
        retention-days: 30
