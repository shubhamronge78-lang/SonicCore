name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v2.0.0)'
        required: true
        default: 'v2.0.0'

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build Debug APK
      working-directory: conversations/6a7a961312b12b330076a6ce/android-eq
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon -x test

    - name: Rename APK with version
      run: |
        VERSION="${{ github.ref_name }}"
        if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
          VERSION="${{ github.event.inputs.version }}"
        fi
        VERSION="${VERSION#v}"
        cp conversations/6a7a961312b12b330076a6ce/android-eq/app/build/outputs/apk/debug/app-debug.apk "SonicCore-v${VERSION}.apk"
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "APK_FILE=SonicCore-v${VERSION}.apk" >> $GITHUB_ENV

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ env.VERSION }}
        name: "SonicCore Equalizer v${{ env.VERSION }}"
        body: |
          # 🎧 SonicCore Equalizer v${{ env.VERSION }}

          ## 📦 Installation
          1. Download the APK file below
          2. Enable "Install from unknown sources" in Android Settings
          3. Tap the downloaded APK to install
          4. Grant audio permissions when prompted
          5. Toggle the EQ on and enjoy!

          ## ✨ What's New in 3.8.0
          - 🎨 **Liquid Glass redesign** — frosted glass panels, specular highlights, AMOLED-inspired backgrounds, restrained accent lighting
          - 🔊 **Full SonicCore Equalizer rebranding** — all user-facing references updated
          - 🎚️ **Parametric EQ with glass sliders** — functional gain sliders with labeled sections
          - 📊 **Frequency-response graph** — real-time visual feedback
          - 🔧 **Critical limiter/compressor fix (v146)** — both stages now track gain reduction (≤0 dB) instead of smoothed detector level, fixing the -6 dBFS → -68 dBFS crush bug
          - 📈 **DSP telemetry** — live GR, DSP block µs, config version lines
          - 🧪 **Expanded DSP harness** — 23 test sections, 66 assertions with ASan+UBSan

          ## ✨ Core Features
          - System-wide audio equalization (all apps)
          - 10 built-in presets + unlimited custom presets
          - 5/10/15/31 band equalizer
          - Auto-apply last preset on startup
          - Liquid Glass AMOLED dark theme
          - Background foreground service

          ## 📋 Requirements
          - Android 5.0+ (API 21+)
          - ~10 MB storage space

          ---
          Built from commit ${{ github.sha }}
        files: ${{ env.APK_FILE }}
        prerelease: false
        draft: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
